<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iberio-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#iberio-grad)" filter="url(#shadow)" />
  
  <!-- Centered Nested Aztec Bird Mascot SVG -->
  <svg viewBox="0 0 100 100" x="96" y="80" width="320" height="320" fill="none">
    <!-- Beak lines -->
    <line x1="41" y1="21" x2="31" y2="21" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="41" y1="27" x2="29" y2="27" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="41" y1="33" x2="31" y2="33" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Head & Neck -->
    <path d="M 43 37 C 43 18, 59 18, 59 29 C 59 36, 54 39, 50 41" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Eye (Concentric) -->
    <circle cx="50" cy="27" r="7.5" stroke="#ffffff" stroke-width="2.2" fill="none" />
    <circle cx="50" cy="27" r="3" fill="#ffffff" />

    <!-- Central Aztec Shield Body (Concentric Circles) -->
    <circle cx="50" cy="53" r="14.5" stroke="#ffffff" stroke-width="2.5" fill="none" />
    <circle cx="50" cy="53" r="9.5" stroke="#ffffff" stroke-width="2.5" fill="none" />
    <circle cx="50" cy="53" r="4.5" fill="#ffffff" />

    <!-- Left Wing & Feathers -->
    <path d="M 36 41 L 13 41 C 11 41, 11 43, 11 45 L 11 61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
    <line x1="17" y1="41" x2="17" y2="61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="23" y1="41" x2="23" y2="61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="29" y1="41" x2="29" y2="61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="35" y1="41" x2="35" y2="61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Right Wing & Feathers -->
    <path d="M 64 41 L 87 41 C 89 41, 89 43, 89 45 L 89 61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
    <line x1="83" y1="41" x2="83" y2="61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="77" y1="41" x2="77" y2="61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="71" y1="41" x2="71" y2="61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="65" y1="41" x2="65" y2="61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Tail Feathers (Splayed) -->
    <line x1="41" y1="67" x2="37" y2="85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="68" x2="43" y2="88" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="69" x2="50" y2="90" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="55" y1="68" x2="57" y2="88" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="59" y1="67" x2="63" y2="85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </svg>
</svg>
